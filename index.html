<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>URBAN CLOTHING</h1>
    <button id="switch">Switch</button>


    <header>
        <nav>

            <ul>
                <li><a href="#about">about</a></li>
                <li><a href="#products">products</a></li>
                <li><a href="#services">services</a></li>
                <li><a href="#contact">Contact me</a></li>





            </ul>
        </nav>
    </header>

    <main>
        <section id="products">
            <h1 class="products">Our Products</h1>
            <p>WE SELL A VARIETY OF CLOTHES, JUST CHOOSE WHAT YOU WANT TO BUY.
        </section>

        <section id="services">
            <h1 class="services">Our Services</h1>
            <p>GOOD SERVICE</p>
            <P>QUALITY CLOTHES</P>
            <P>AFFORDABLE PRICE</P>
            <P>CUSTOMIZE CLOTHES</P>
        </section>

        <section id="contact">
            <h2 class="contact">JUST FILL THIS UP AND YOU'RE GOOD TO GO!</h2>
            <form action="#">
                <!-- Name -->
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <!-- Email -->
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>

                <!-- Message -->
                <label for="message">Message</label>
                <textarea name="message" id="message" rows="5" required></textarea>

                <!-- Submit -->
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
